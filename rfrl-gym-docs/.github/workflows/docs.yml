name: Documentation

on:
  push:
    branches:
      - master
      - main
    paths:
      - 'rfrl-gym-docs/**'

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: rfrl-gym-docs

    steps:
      - uses: actions/configure-pages@v6
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: 3.x

      - name: Install dependencies
        run: |
          pip install zensical
          pip install mkdocstrings mkdocstrings-python

      - run: zensical build --clean -f zensical.toml

      - uses: actions/upload-pages-artifact@v5
        with:
          path: rfrl-gym-docs/site

      - uses: actions/deploy-pages@v5
        id: deployment



